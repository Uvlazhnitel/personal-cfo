services:
  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:80'
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      APP_ORIGIN: http://127.0.0.1:8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-personal_cfo}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-personal_cfo_dev}
      HOSTNAME: 0.0.0.0
      NODE_ENV: development
      PORT: '3000'
      SESSION_COOKIE_SECURE: 'false'
      ENABLE_BANKING_APPLICATION_ID: ${ENABLE_BANKING_APPLICATION_ID:-}
      ENABLE_BANKING_PRIVATE_KEY_PATH: ${ENABLE_BANKING_PRIVATE_KEY_PATH:-}
      ENABLE_BANKING_OWNER_ID: ${ENABLE_BANKING_OWNER_ID:-}
      ENABLE_BANKING_REDIRECT_URL: ${ENABLE_BANKING_REDIRECT_URL:-}
      ENABLE_BANKING_DATA_KEY: ${ENABLE_BANKING_DATA_KEY:-}
      ENABLE_BANKING_API_BASE_URL: ${ENABLE_BANKING_API_BASE_URL:-https://api.enablebanking.com}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-personal_cfo}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-personal_cfo_dev}
      MIGRATIONS_DIR: /app/migrations
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:-}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
      SHARESIGHT_CLIENT_ID: ${SHARESIGHT_CLIENT_ID:-}
      SHARESIGHT_CLIENT_SECRET: ${SHARESIGHT_CLIENT_SECRET:-}
      SHARESIGHT_PORTFOLIO_ID: ${SHARESIGHT_PORTFOLIO_ID:-}
      SHARESIGHT_OWNER_ID: ${SHARESIGHT_OWNER_ID:-}
      SHARESIGHT_INVESTMENT_ACCOUNT_ID: ${SHARESIGHT_INVESTMENT_ACCOUNT_ID:-}
      SHARESIGHT_RAW_RECEIPT_KEY: ${SHARESIGHT_RAW_RECEIPT_KEY:-}
      SHARESIGHT_API_BASE_URL: ${SHARESIGHT_API_BASE_URL:-https://api.sharesight.com}
      PORTFOLIO_MANAGER_BASE_URL: ${PORTFOLIO_MANAGER_BASE_URL:-}
      PORTFOLIO_MANAGER_API_TOKEN: ${PORTFOLIO_MANAGER_API_TOKEN:-}
      PORTFOLIO_MANAGER_OWNER_ID: ${PORTFOLIO_MANAGER_OWNER_ID:-}
      PORTFOLIO_MANAGER_INVESTMENT_ACCOUNT_ID: ${PORTFOLIO_MANAGER_INVESTMENT_ACCOUNT_ID:-}
      PORTFOLIO_MANAGER_RAW_RECEIPT_KEY: ${PORTFOLIO_MANAGER_RAW_RECEIPT_KEY:-}
      ENABLE_BANKING_APPLICATION_ID: ${ENABLE_BANKING_APPLICATION_ID:-}
      ENABLE_BANKING_PRIVATE_KEY_PATH: ${ENABLE_BANKING_PRIVATE_KEY_PATH:-}
      ENABLE_BANKING_OWNER_ID: ${ENABLE_BANKING_OWNER_ID:-}
      ENABLE_BANKING_REDIRECT_URL: ${ENABLE_BANKING_REDIRECT_URL:-}
      ENABLE_BANKING_DATA_KEY: ${ENABLE_BANKING_DATA_KEY:-}
      ENABLE_BANKING_API_BASE_URL: ${ENABLE_BANKING_API_BASE_URL:-https://api.enablebanking.com}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ['node', 'dist/cli/migrate.js']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-personal_cfo}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-personal_cfo_dev}
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['tools']

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_cfo_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_USER: ${POSTGRES_USER:-personal_cfo}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: personal_cfo_test
      POSTGRES_PASSWORD: test-only
      POSTGRES_USER: personal_cfo_test
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U personal_cfo_test -d personal_cfo_test']
      interval: 2s
      timeout: 3s
      retries: 20
    profiles: ['test']
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres_data:
